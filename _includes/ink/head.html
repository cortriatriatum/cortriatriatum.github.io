<script>
  /* Before first paint: saved theme, and Plain mode (no drawings). localStorage may be blocked. */
  try {
    var _t = localStorage.getItem('theme'); if (_t === 'dark' || _t === 'light') document.documentElement.setAttribute('data-theme', _t);
    if (localStorage.getItem('plain') === '1' || /[?&]plain\b/.test(location.search)) document.documentElement.classList.add('plain');
  } catch (e) {}
</script>
