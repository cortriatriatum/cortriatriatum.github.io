<script>
/* Theme and Plain switches, shared by every page. */
(function(){
  var root = document.documentElement, th = document.getElementById('themeToggle'), pl = document.getElementById('plainToggle');
  function sysDark(){ try { return matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; } }
  function cur(){ return root.getAttribute('data-theme') || (sysDark() ? 'dark' : 'light'); }
  function syncTheme(){ var d = cur() === 'dark'; th.textContent = d ? 'Light' : 'Dark'; th.setAttribute('aria-pressed', String(d)); th.setAttribute('aria-label', d ? 'Switch to light theme' : 'Switch to dark theme'); }
  th.addEventListener('click', function(){ var n = cur() === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', n); try { localStorage.setItem('theme', n); } catch (e) {} syncTheme(); });
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if (!root.getAttribute('data-theme')) syncTheme(); }); } catch (e) {}
  syncTheme();
  function syncPlain(){ var p = root.classList.contains('plain'); pl.setAttribute('aria-pressed', String(p)); pl.textContent = p ? 'Drawings' : 'Plain'; pl.title = p ? 'Turn the drawings back on' : 'Turn the drawings off'; }
  pl.addEventListener('click', function(){ var p = !root.classList.contains('plain'); root.classList.toggle('plain', p); try { localStorage.setItem('plain', p ? '1' : '0'); } catch (e) {} syncPlain(); document.dispatchEvent(new CustomEvent('plainchange')); });
  syncPlain();
})();
</script>
