# GitHub Pages builds this site with Jekyll. No plugins.
title: Rick Mathews, PhD
author: Rick Mathews
description: "Rick Mathews. Biomedical engineer and Physician-Scientist in training at the Oregon Health & Science University."
url: https://cortriatriatum.github.io
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  footnote_backlink: "↩"

# Essays: one Markdown file per essay in _essays/. See WRITING.md.
collections:
  essays:
    output: true    # each essay gets a web page at /essays/<name>/ (layout: essay) plus a PDF (pdf: in front matter)
    permalink: /essays/:name/

defaults:
  - scope: { type: essays }
    values: { layout: essay, status: "Work in progress" }   # set status: "" on an essay to drop the label

exclude: [README.md, WRITING.md, assets/fonts/README.md, tools/, Gemfile, Gemfile.lock, vendor/, me-site-v3/]
